<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام جرد السيريالات</title>
    <!-- مكتبة قراءة الباركود بالكاميرا -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <!-- مكتبة تصدير الإكسيل -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --primary-red: #e60000;
            --dark-red: #b30000;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-dark: #222222;
        }
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-box {
            width: 95px;
            height: 95px;
            margin: 0 auto 12px;
            background-color: var(--primary-red);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(230, 0, 0, 0.25);
            overflow: hidden;
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            margin: 5px 0;
            font-size: 24px;
            color: var(--primary-red);
        }
        p.subtitle {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
        .counter-box {
            background: #fff0f0;
            border: 1px solid #ffcccc;
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            margin: 18px 0;
        }
        .counter-box span {
            display: block;
            font-size: 14px;
            color: #555;
        }
        .counter-box strong {
            font-size: 32px;
            color: var(--primary-red);
        }
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            display: none;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            min-width: 120px;
        }
        .btn-start { background-color: var(--primary-red); color: white; }
        .btn-start:hover { background-color: var(--dark-red); }
        .btn-stop { background-color: #555; color: white; }
        .btn-add { background-color: #198754; color: white; min-width: 80px; flex: 0.4; }
        .btn-excel { background-color: #1d6f42; color: white; }
        .btn-whatsapp { background-color: #25d366; color: white; }
        .btn-clear-all {
            background-color: #dc3545;
            color: white;
            padding: 6px 12px;
            font-size: 13px;
            flex: none;
            min-width: auto;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: var(--primary-red);
        }
        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            margin-bottom: 10px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }
        .records-header h3 {
            margin: 0;
            font-size: 18px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            padding: 10px 6px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        th {
            background-color: #f8f9fa;
            color: #444;
        }
        .btn-delete-one {
            background-color: #ffe5e5;
            color: #d90429;
            border: 1px solid #ffccd5;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 13px;
            min-width: auto;
        }
        .btn-delete-one:hover {
            background-color: #d90429;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-box">
            <!-- ضع صورة اللوجو باسم logo.png في نفس المجلد -->
            <img src="logo.png" alt="Etisalat" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'color:white;font-weight:bold;font-size:20px;\'>etisalat</span>';">
        </div>
        <h1>نظام جرد السيريالات</h1>
        <p class="subtitle">مسح الباركود وحفظ الورق</p>
    </div>

    <div class="counter-box">
        <span>إجمالي الورق المسجل</span>
        <strong id="totalCount">0</strong>
    </div>

    <div id="reader"></div>

    <div class="btn-group">
        <button class="btn-start" onclick="startScanner()">📷 تشغيل الكاميرا للمسح</button>
        <button class="btn-stop" onclick="stopScanner()">⏹ إيقاف الكاميرا</button>
    </div>

    <div class="input-group">
        <input type="text" id="serialInput" placeholder="اكتب السيريال أو امسحه بالباركود..." onkeypress="handleEnter(event)">
        <button class="btn-add" onclick="addManualSerial()">إضافة</button>
    </div>

    <div class="btn-group">
        <button class="btn-excel" onclick="exportToExcel()">📥 تحميل Excel</button>
        <button class="btn-whatsapp" onclick="copyForWhatsApp()">📋 نسخ للواتساب</button>
    </div>

    <div class="records-header">
        <h3>السجل المحفوظ</h3>
        <button class="btn-clear-all" onclick="clearAll()">مسح الكل 🗑</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>السيريال</th>
                <th>الوقت</th>
                <th>حذف</th>
            </tr>
        </thead>
        <tbody id="recordsTable"></tbody>
    </table>
</div>

<script>
    let serials = JSON.parse(localStorage.getItem('etisalat_serials')) || [];
    let html5QrCode = null;
    let lastScanned = "";
    let lastScanTime = 0;

    function renderTable() {
        const tbody = document.getElementById('recordsTable');
        const totalCount = document.getElementById('totalCount');
        tbody.innerHTML = '';
        totalCount.innerText = serials.length;

        serials.forEach((item, index) => {
            const row = `
                <tr>
                    <td>${index + 1}</td>
                    <td style="font-weight:bold; direction:ltr;">${item.code}</td>
                    <td>${item.time}</td>
                    <td>
                        <button class="btn-delete-one" onclick="deleteSingle(${index})" title="حذف هذا السيريال">❌</button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });

        localStorage.setItem('etisalat_serials', JSON.stringify(serials));
    }

    function addSerial(code) {
        code = code.trim();
        if (!code) return;

        // منع التكرار
        if (serials.some(item => item.code === code)) {
            alert("⚠️ هذا السيريال مسجل بالفعل!");
            return;
        }

        const now = new Date();
        const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        serials.unshift({ code: code, time: timeString });
        renderTable();
    }

    function addManualSerial() {
        const input = document.getElementById('serialInput');
        addSerial(input.value);
        input.value = '';
        input.focus();
    }

    function handleEnter(e) {
        if (e.key === 'Enter') addManualSerial();
    }

    // ميزة حذف سيريال واحد
    function deleteSingle(index) {
        if (confirm(`هل أنت متأكد من حذف السيريال: ${serials[index].code} ؟`)) {
            serials.splice(index, 1);
            renderTable();
        }
    }

    function clearAll() {
        if (serials.length === 0) return;
        if (confirm("هل أنت متأكد من مسح جميع السيريالات؟")) {
            serials = [];
            renderTable();
        }
    }

    function startScanner() {
        const readerDiv = document.getElementById('reader');
        readerDiv.style.display = 'block';
        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 150 } },
            (decodedText) => {
                const now = Date.now();
                if (decodedText !== lastScanned || now - lastScanTime > 2500) {
                    lastScanned = decodedText;
                    lastScanTime = now;
                    addSerial(decodedText);
                }
            },
            (errorMessage) => {}
        ).catch(err => {
            alert("تعذر تشغيل الكاميرا، تأكد من منح الصلاحية للمتصفح.");
