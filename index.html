<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جرد المشرق</title>
<script src="https://cloudflare.com"></script>
<script src="https://unpkg.com"></script>
<style>
  *{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
  body{background:#000000;color:#ffffff;margin:0;padding:15px;display:flex;justify-content:center}
  .box{width:100%;max-width:500px;background:#141414;padding:20px;border-radius:18px;border:1px solid #2a2a2a;box-shadow:0 5px 25px rgba(230,0,0,0.18)}
  .logo{width:85px;height:85px;margin:0 auto 10px;background:#e60000;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 12px rgba(230,0,0,0.4)}
  .logo img{width:100%;height:100%;object-fit:cover}
  h1{text-align:center;color:#ff2a2a;font-size:24px;margin:5px 0}
  .count{background:#1f0a0a;border:1px solid #5c1414;border-radius:12px;padding:10px;text-align:center;margin:15px 0}
  .count span{color:#cccccc;font-size:14px}
  .count strong{font-size:30px;color:#ff2a2a;display:block}
  #camBox{display:none;position:relative;width:100%;margin-bottom:12px;border-radius:12px;overflow:hidden;border:2px solid #e60000;background:#000}
  video{width:100%;height:240px;object-fit:cover;display:block}
  .scan-line{position:absolute;top:50%;left:10%;right:10%;height:2px;background:#ff2a2a;box-shadow:0 0 8px #ff2a2a}
  .row{display:flex;gap:8px;margin-bottom:12px}
  button{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:bold;color:#fff;cursor:pointer}
  .red{background:#e60000} .gray{background:#333333} .green{background:#198754;flex:.4}
  .excel{background:#1d6f42} .wa{background:#25d366} .del-all{background:#b02a37;padding:6px 10px;font-size:12px;flex:none}
  input{flex:1;padding:12px;background:#222222;color:#ffffff;border:1px solid #444444;border-radius:10px;font-size:15px;outline:none}
  input::placeholder{color:#888888}
  input:focus{border-color:#e60000}
  table{width:100%;border-collapse:collapse;text-align:center;margin-top:10px}
  th{background:#1f1f1f;color:#cccccc;padding:9px 5px;border-bottom:1px solid #333;font-size:14px}
  td{padding:9px 5px;border-bottom:1px solid #262626;font-size:14px;color:#eeeeee}
  .del-one{background:#3a1216;color:#ff4d5a;border:1px solid #6e1e26;padding:4px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><img src="logo.png" onerror="this.style.display='none';this.parentNode.innerHTML='<b style=color:#fff>etisalat</b>'"></div>
  <h1>جرد المشرق</h1>
  <div class="count"><span>إجمالي الورق المسجل</span><strong id="cnt">0</strong></div>
  
  <div id="camBox">
    <video id="vid" playsinline></video>
    <div class="scan-line"></div>
  </div>

  <div class="row">
    <button class="red" onclick="startCam()">📷 تشغيل الكاميرا</button>
    <button class="gray" onclick="stopCam()">⏹ إيقاف</button>
  </div>
  <div class="row">
    <input type="text" id="inp" placeholder="اكتب السيريال هنا..." onkeypress="if(event.key==='Enter')addManual()">
    <button class="green" onclick="addManual()">إضافة</button>
  </div>
  <div class="row">
    <button class="excel" onclick="toExcel()">📥 تحميل Excel</button>
    <button class="wa" onclick="toWA()">📋 نسخ للواتساب</button>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:15px">
    <b>السجل المحفوظ</b>
    <button class="del-all" onclick="clearAll()">مسح الكل 🗑</button>
  </div>
  <table><thead><tr><th>#</th><th>السيريال</th><th>الوقت</th><th>حذف</th></tr></thead><tbody id="tb"></tbody></table>
</div>

<script>
let list = JSON.parse(localStorage.getItem('s_list') || '[]');
let codeReader = null, last = '', lastT = 0;

function beep() {
  try {
    let ctx = new (window.AudioContext || window.webkitAudioContext)();
    let osc = ctx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = 800;
    osc.connect(ctx.destination); osc.start();
    setTimeout(() => osc.stop(), 120);
  } catch(e) {}
}

function draw() {
  document.getElementById('cnt').innerText = list.length;
  let html = '';
  for (let i = 0; i < list.length; i++) {
    html += `<tr><td>${i+1}</td><td dir="ltr"><b>${list[i].c}</b></td><td>${list[i].t}</td><td><button class="del-one" onclick="delOne(${i})">❌</button></td></tr>`;
  }
  document.getElementById('tb').innerHTML = html;
  localStorage.setItem('s_list', JSON.stringify(list));
}

function addCode(code) {
  code = code.trim();
  if (!code) return;
  if (list.some(x => x.c === code)) { alert('السيريال مسجل من قبل!'); return; }
  let t = new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  list.unshift({c: code, t: t});
  beep();
  draw();
}

function addManual() {
  let inp = document.getElementById('inp');
  addCode(inp.value);
  inp.value = '';
}

function delOne(i) {
  if (confirm('حذف السيريال: ' + list[i].c + ' ؟')) { list.splice(i, 1); draw(); }
}

function clearAll() {
  if (list.length && confirm('مسح جميع السيريالات؟')) { list = []; draw(); }
}

async function startCam() {
  const camBox = document.getElementById('camBox');
  camBox.style.display = 'block';
  try {
    if (!codeReader) codeReader = new ZXing.BrowserMultiFormatReader();
    await codeReader.decodeFromConstraints(
      { video: { facingMode: { ideal: 'environment' } } },
      'vid',
      (result, err) => {
        if (result) {
          let txt = result.getText();
          let now = Date.now();
          if (txt !== last || now - lastT > 2500) {
            last = txt; lastT = now; addCode(txt);
          }
        }
      }
    );
  } catch (e) {
    camBox.style.display = 'none';
    alert('افتح الرابط في متصفح Google Chrome واسمح بصلاحية الكاميرا');
  }
}

function stopCam() {
  if (codeReader) {
    codeReader.reset();
    document.getElementById('camBox').style.display = 'none';
  }
}

function toExcel() {
  if (!list.length) return alert('القائمة فارغة');
  let d = list.map((x, i) => ({'م': i+1, 'السيريال': x.c, 'الوقت': x.t}));
  let ws = XLSX.utils.json_to_sheet(d), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'جرد المشرق');
  XLSX.writeFile(wb, 'جرد_المشرق.xlsx');
}

function toWA() {
  if (!list.length) return alert('القائمة فارغة');
  let txt = '*جرد المشرق (' + list.length + ')*\n' + list.map((x, i) => `${i+1}- ${x.c}`).join('\n');
  navigator.clipboard.writeText(txt).then(() => alert('تم النسخ للواتساب ✅'));
}

draw();
</script>
</body>
</html>
